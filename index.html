<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Entspricht --background im Dark-Theme (hsl(20 14% 6%)); html.dark ist
         fest gesetzt, die App rendert immer dunkel. Gleicher Wert im Manifest. -->
    <meta name="theme-color" content="#110F0D" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS kennt weder das Manifest noch beforeinstallprompt: Vollbild,
         Statusleiste und Home-Bildschirm-Name kommen nur über diese Metatags.
         status-bar-style "black" statt "black-translucent", weil nur ein Screen
         safe-area-inset-top auswertet — translucent würde Inhalte unter die
         Statusleiste schieben. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Physiospree" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter+Tight:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Physiospree Gym</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
